[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aat-devqa"
version = "1.7.0"
description = "AWT (AI Watch Tester) — AI-powered E2E testing with self-healing DevQA loop"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "AILoopLab", email = "ksgisang@gmail.com" }]
keywords = [
    "testing", "automation", "ai", "devqa", "e2e",
    "playwright", "self-healing", "qa", "web-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
    "Framework :: Pytest",
]

dependencies = [
    # CLI
    "typer[all]>=0.9,<1.0",
    # Config
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "pyyaml>=6.0,<7.0",
    # Engine
    "playwright>=1.40,<2.0",
    "pyautogui>=0.9.54,<1.0",
    # Image Matching
    "opencv-python-headless>=4.8,<5.0",
    "numpy>=1.24,<3.0",
    "pillow>=10.0,<12.0",
    # OCR
    "pytesseract>=0.3.10,<1.0",
    # AI
    "anthropic>=0.40,<1.0",
    "openai>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    # Reporter
    "jinja2>=3.1,<4.0",
    # Misc
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
watch = [
    "watchfiles>=0.21,<2.0",
]
web = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "websockets>=12.0,<14.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0,<7.0",
    "python-docx>=1.0,<2.0",
    "cryptography>=41.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
    "pre-commit>=3.6,<4.0",
    "pytest-mock>=3.12,<4.0",
    "types-PyYAML>=6.0,<7.0",
    "pandas>=2.0",
]

[project.scripts]
aat = "aat.cli.main:app"

[project.urls]
Homepage = "https://github.com/ksgisang/AI-Watch-Tester"
Repository = "https://github.com/ksgisang/AI-Watch-Tester"
"Bug Tracker" = "https://github.com/ksgisang/AI-Watch-Tester/issues"
"Agent Skill" = "https://github.com/ksgisang/awt-skill"

[tool.hatch.build.targets.wheel]
packages = ["src/aat"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in FastAPI default args is idiomatic

[tool.ruff.lint.per-file-ignores]
# JS-in-Python strings + Korean data literals make E501 impractical
"cloud/app/crawler.py" = ["E501"]
"cloud/app/test_patterns.py" = ["E501"]
# AI prompt templates contain long lines by design
"cloud/app/routers/scan.py" = ["E501"]
"cloud/app/routers/tests.py" = ["E501"]

[tool.mypy]
# No python_version pin: mypy follows the running interpreter, so each CI job
# checks the version it actually installed. Pinning 3.11 made the 3.12 job fail
# to parse numpy's stubs, which use 3.12-only `type` statements.
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: End-to-end tests requiring real AI API keys (not run in CI)",
]

[tool.coverage.run]
source = ["src/aat"]
omit = ["*/tests/*"]
